<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Waffle Store - Products</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff7eb;
            margin: 0;
        }
        header {
            background: #f4a261;
            padding: 20px;
            text-align: center;
            color: white;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            padding: 40px;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card img {
            width: 100%;
            border-radius: 10px;
        }
        .btn {
            display: inline-block;
            margin-top: 10px;
            background: #e76f51;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h2>Our Waffles</h2>
</header>

<div class="products">

    <div class="card">
        <img src="https://picsum.photos/300?1">
        <h3>Classic Butter Waffle</h3>
        <p>$5.99</p>
        <a href="payment.html" class="btn">Buy Now</a>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300?2">
        <h3>Chocolate Drizzle Waffle</h3>
        <p>$6.99</p>
        <a href="payment.html" class="btn">Buy Now</a>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300?3">
        <h3>Strawberry Bliss Waffle</h3>
        <p>$7.99</p>
        <a href="payment.html" class="btn">Buy Now</a>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300?4">
        <h3>Blueberry Heaven</h3>
        <p>$7.49</p>
        <a href="payment.html" class="btn">Buy Now</a>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300?5">
        <h3>Banana Caramel Waffle</h3>
        <p>$8.49</p>
        <a href="payment.html" class="btn">Buy Now</a>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300?6">
        <h3>Nutella Explosion</h3>
        <p>$8.99</p>
        <a href="payment.html" class="btn">Buy Now</a>
    </div>

</div>

</body>
</html>
